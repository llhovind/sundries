name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are wasted money — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, declared here rather than left to the
# repository default so the workflow keeps this scope even if that default is
# widened later. Every job only reads the tree; uploading the Playwright report
# needs no additional scope. A job that ever has to write back — a release, a
# comment on a PR — should raise its own `permissions:` block rather than
# loosening this one.
permissions:
  contents: read

# Backend config validates all of these at startup and throws if any is
# missing. SMTP values are deliberate dummies (config requires them even
# when unused) and MAIL_PROVIDER=noop keeps CI from attempting sends.
env:
  MAIL_PROVIDER: noop
  DB_HOST: localhost
  DB_PORT: '5432'
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: store
  DB_SSL: 'false'          # service container speaks plaintext; default is TLS
  JWT_ACCESS_SECRET: ci-only-access-secret
  JWT_REFRESH_SECRET: ci-only-refresh-secret
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_USER: ci
  SMTP_PASSWORD: ci
  SMTP_FROM: noreply@example.com
  ADMIN_EMAIL: admin@example.com

jobs:
  backend-tests:
    name: Backend tests (Jest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store
        ports:
          - 5432:5432
        # Gate the job on Postgres actually accepting connections
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate schema and seed data
        run: npm run setup

      - name: Run tests
        run: npm test

  frontend-unit:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Migrate schema and seed data
        working-directory: backend
        run: npm run setup

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.js boots the backend (port 3000) and Vite (5173)
      # itself; both inherit this job's env, including the DB settings.
      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
